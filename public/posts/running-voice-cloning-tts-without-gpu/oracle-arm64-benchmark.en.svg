  <text x="604" y="492" fill="#111111" font-size="12" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas',monospace">0.496</text>
  <text x="708" y="199" fill="#BD746D" font-size="12" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas',monospace">4.171</text>
  <text x="656" y="576" fill="#111111" font-size="16" font-weight="700" text-anchor="middle" font-family="'Inter','Helvetica Neue','Arial',sans-serif">Multiple lines</text>
  <text x="656" y="596" fill="#737373" font-size="12" font-weight="500" text-anchor="middle" font-family="'Inter','Helvetica Neue','Arial',sans-serif">Supertonic 93 · Audio8 97 chars</text>

  <rect x="900" y="507.84" width="80" height="36.16" fill="#111111"/>
  <rect x="1004" y="187.84" width="80" height="356.16" fill="#F4B9A4" stroke="#BD746D" stroke-width="1.2"/>
  <text x="940" y="496" fill="#111111" font-size="12" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas',monospace">0.452</text>
  <text x="1044" y="176" fill="#BD746D" font-size="12" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas',monospace">4.452</text>
  <text x="992" y="576" fill="#111111" font-size="16" font-weight="700" text-anchor="middle" font-family="'Inter','Helvetica Neue','Arial',sans-serif">Paragraph</text>
  <text x="992" y="596" fill="#737373" font-size="12" font-weight="500" text-anchor="middle" font-family="'Inter','Helvetica Neue','Arial',sans-serif">Supertonic 206 · Audio8 215 chars</text>

  <text x="1192" y="454" fill="#2563EB" font-size="12" font-weight="600" text-anchor="end" font-family="'Inter','Helvetica Neue','Arial',sans-serif">Real-time threshold · RTF 1.0</text>

  <line x1="48" y1="624" x2="1232" y2="624" stroke="rgba(17,17,17,0.12)" stroke-width="0.8"/>
  <rect x="48" y="644" width="16" height="16" fill="#111111"/>
  <text x="76" y="657" fill="#111111" font-size="12" font-weight="600" font-family="'Inter','Helvetica Neue','Arial',sans-serif">Supertonic 3</text>
  <text x="184" y="657" fill="#737373" font-size="12" font-weight="500" font-family="'Inter','Helvetica Neue','Arial',sans-serif">CPU 2 cores · 4GB · 5 steps</text>
  <rect x="484" y="644" width="16" height="16" fill="#F4B9A4" stroke="#BD746D" stroke-width="1.2"/>
  <text x="512" y="657" fill="#111111" font-size="12" font-weight="600" font-family="'Inter','Helvetica Neue','Arial',sans-serif">Audio8 0.1B</text>
  <text x="624" y="657" fill="#737373" font-size="12" font-weight="500" font-family="'Inter','Helvetica Neue','Arial',sans-serif">CPU 4 cores · 6GB · top_k=1</text>
  <text x="1232" y="657" fill="#737373" font-size="12" font-weight="500" text-anchor="end" font-family="'Inter','Helvetica Neue','Arial',sans-serif">Production settings on the same server · similar, not identical, input lengths</text>
</svg>
