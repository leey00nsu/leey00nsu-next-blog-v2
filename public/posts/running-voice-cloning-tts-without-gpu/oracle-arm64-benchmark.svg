    <text x="96" y="164" fill="#595959" font-size="8" text-anchor="end" font-family="'SF Mono','Menlo',monospace">35</text>
    <text x="96" y="242" fill="#595959" font-size="8" text-anchor="end" font-family="'SF Mono','Menlo',monospace">28</text>
    <text x="96" y="319" fill="#595959" font-size="8" text-anchor="end" font-family="'SF Mono','Menlo',monospace">21</text>
