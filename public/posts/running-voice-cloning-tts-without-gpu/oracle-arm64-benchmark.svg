<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oracle-arm64-benchmark-title oracle-arm64-benchmark-desc">
    <title id="oracle-arm64-benchmark-title">Oracle ARM64 5-step TTS 벤치마크</title>
    <desc id="oracle-arm64-benchmark-desc">한 줄, 여러 줄, 문단 입력에 대해 공개 HTTPS 응답 시간과 생성된 음성 길이를 0초 기준의 grouped bar chart로 비교한다.</desc>
    <defs>
      <marker id="oab-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#595959"/></marker>
      <marker id="oab-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#BD746D"/></marker>
      <marker id="oab-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563EB"/></marker>
    </defs>

    <rect width="1280" height="720" fill="#FBFAF7"/>
    <text x="48" y="64" fill="#111111" font-size="28" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">생성된 음성보다 응답 시간이 짧았다</text>
    <text x="48" y="96" fill="#595959" font-size="12" font-weight="500" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">Oracle Ampere A1 · CPU 2 cores · 5 steps · 공개 HTTPS 요청 · 각 3회 평균</text>
    <rect x="1184" y="40" width="48" height="32" rx="8" fill="#FBFAF7" stroke="#111111" stroke-width="1.2"/>
    <text x="1208" y="61" fill="#111111" font-size="12" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo',monospace">03</text>

