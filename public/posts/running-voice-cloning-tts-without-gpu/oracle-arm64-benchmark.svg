  <text x="320" y="596" fill="#737373" font-size="12" font-weight="500" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">두 모델 모두 27자</text>

  <rect x="564" y="504.32" width="80" height="39.68" fill="#111111"/>
  <rect x="668" y="210.32" width="80" height="333.68" fill="#F4B9A4" stroke="#BD746D" stroke-width="1.2"/>
  <text x="604" y="492" fill="#111111" font-size="12" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas',monospace">0.496</text>
  <text x="708" y="199" fill="#BD746D" font-size="12" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas',monospace">4.171</text>
  <text x="656" y="576" fill="#111111" font-size="16" font-weight="700" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">여러 줄</text>
  <text x="656" y="596" fill="#737373" font-size="12" font-weight="500" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">Supertonic 93자 · Audio8 97자</text>

  <rect x="900" y="507.84" width="80" height="36.16" fill="#111111"/>
  <rect x="1004" y="187.84" width="80" height="356.16" fill="#F4B9A4" stroke="#BD746D" stroke-width="1.2"/>
  <text x="940" y="496" fill="#111111" font-size="12" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas',monospace">0.452</text>
  <text x="1044" y="176" fill="#BD746D" font-size="12" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas',monospace">4.452</text>
  <text x="992" y="576" fill="#111111" font-size="16" font-weight="700" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">문단</text>
  <text x="992" y="596" fill="#737373" font-size="12" font-weight="500" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">Supertonic 206자 · Audio8 215자</text>

  <text x="1192" y="454" fill="#2563EB" font-size="12" font-weight="600" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">실시간 기준 RTF 1.0</text>

  <line x1="48" y1="624" x2="1232" y2="624" stroke="rgba(17,17,17,0.12)" stroke-width="0.8"/>
  <rect x="48" y="644" width="16" height="16" fill="#111111"/>
  <text x="76" y="657" fill="#111111" font-size="12" font-weight="600" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">Supertonic 3</text>
  <text x="184" y="657" fill="#737373" font-size="12" font-weight="500" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">CPU 2 cores · 4GB · 5 steps</text>
  <rect x="484" y="644" width="16" height="16" fill="#F4B9A4" stroke="#BD746D" stroke-width="1.2"/>
  <text x="512" y="657" fill="#111111" font-size="12" font-weight="600" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">Audio8 0.1B</text>
  <text x="624" y="657" fill="#737373" font-size="12" font-weight="500" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">CPU 4 cores · 6GB · top_k=1</text>
  <text x="1232" y="657" fill="#737373" font-size="12" font-weight="500" text-anchor="end" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">동일 서버의 실제 운영 설정 · 입력 길이는 유사하지만 동일하지 않음</text>
</svg>
