    <line x1="112" y1="238" x2="1200" y2="238" stroke="rgba(17,17,17,0.10)" stroke-width="0.8"/>
    <line x1="112" y1="315" x2="1200" y2="315" stroke="rgba(17,17,17,0.10)" stroke-width="0.8"/>
    <line x1="112" y1="393" x2="1200" y2="393" stroke="rgba(17,17,17,0.10)" stroke-width="0.8"/>
