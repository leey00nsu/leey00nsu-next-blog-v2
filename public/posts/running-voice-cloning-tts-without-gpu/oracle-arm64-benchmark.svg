<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oracle-rtf-ko-title oracle-rtf-ko-desc">
  <title id="oracle-rtf-ko-title">Oracle ARM64에서 측정한 Supertonic과 Audio8의 RTF 비교</title>
  <desc id="oracle-rtf-ko-desc">한 줄, 여러 줄, 문단 입력에서 Supertonic은 모두 RTF 1 미만이었고 Audio8 0.1B는 약 4.2에서 4.5 사이였다.</desc>
  <defs>
    <marker id="oracle-rtf-ko-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#595959"/></marker>
    <marker id="oracle-rtf-ko-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#BD746D"/></marker>
    <marker id="oracle-rtf-ko-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2563EB"/></marker>
  </defs>

  <rect width="1280" height="720" fill="#FBFAF7"/>
  <text x="48" y="64" fill="#111111" font-size="28" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">Supertonic은 실시간보다 빠르고, Audio8은 더 오래 걸렸다</text>
  <text x="48" y="96" fill="#595959" font-size="12" font-weight="500" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">Oracle Ampere A1 · 공개 HTTPS 전체 응답 시간 ÷ 생성 음성 길이 · 성공 요청 평균</text>
  <rect x="1184" y="40" width="48" height="32" rx="8" fill="#FBFAF7" stroke="#111111" stroke-width="1.2"/>
  <text x="1208" y="61" fill="#111111" font-size="12" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas',monospace">03</text>

  <line x1="128" y1="144" x2="1200" y2="144" stroke="rgba(17,17,17,0.10)" stroke-width="0.8"/>
  <line x1="128" y1="224" x2="1200" y2="224" stroke="rgba(17,17,17,0.10)" stroke-width="0.8"/>
  <line x1="128" y1="304" x2="1200" y2="304" stroke="rgba(17,17,17,0.10)" stroke-width="0.8"/>
  <line x1="128" y1="384" x2="1200" y2="384" stroke="rgba(17,17,17,0.10)" stroke-width="0.8"/>
  <line x1="128" y1="464" x2="1200" y2="464" stroke="#2563EB" stroke-width="1.2" stroke-dasharray="8 8"/>
  <line x1="128" y1="544" x2="1200" y2="544" stroke="rgba(17,17,17,0.30)" stroke-width="1.2"/>
  <line x1="128" y1="144" x2="128" y2="544" stroke="rgba(17,17,17,0.30)" stroke-width="1.2"/>

  <text x="112" y="148" fill="#595959" font-size="8" text-anchor="end" font-family="'SF Mono','Menlo','Consolas',monospace">5.0</text>
  <text x="112" y="228" fill="#595959" font-size="8" text-anchor="end" font-family="'SF Mono','Menlo','Consolas',monospace">4.0</text>
  <text x="112" y="308" fill="#595959" font-size="8" text-anchor="end" font-family="'SF Mono','Menlo','Consolas',monospace">3.0</text>
  <text x="112" y="388" fill="#595959" font-size="8" text-anchor="end" font-family="'SF Mono','Menlo','Consolas',monospace">2.0</text>
  <text x="112" y="468" fill="#2563EB" font-size="8" font-weight="700" text-anchor="end" font-family="'SF Mono','Menlo','Consolas',monospace">1.0</text>
  <text x="112" y="548" fill="#595959" font-size="8" text-anchor="end" font-family="'SF Mono','Menlo','Consolas',monospace">0</text>
  <text x="48" y="348" fill="#595959" font-size="8" text-anchor="middle" transform="rotate(-90 48 348)" font-family="'SF Mono','Menlo','Consolas',monospace" letter-spacing="1.2">RTF · 낮을수록 빠름</text>

  <rect x="228" y="487.28" width="80" height="56.72" fill="#111111"/>
  <rect x="332" y="191.52" width="80" height="352.48" fill="#F4B9A4" stroke="#BD746D" stroke-width="1.2"/>
  <text x="268" y="475" fill="#111111" font-size="12" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas',monospace">0.709</text>
  <text x="372" y="180" fill="#BD746D" font-size="12" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo','Consolas',monospace">4.406</text>
