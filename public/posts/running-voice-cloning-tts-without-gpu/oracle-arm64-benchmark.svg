    <text x="76" y="684" fill="#595959" font-size="8" font-family="'SF Mono','Menlo',monospace">응답 시간</text>
    <rect x="176" y="672" width="16" height="16" rx="4" fill="#F9E8DF" stroke="#595959"/>
