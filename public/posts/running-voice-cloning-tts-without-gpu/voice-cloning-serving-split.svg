<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="voice-cloning-serving-split-title voice-cloning-serving-split-desc">
    <title id="voice-cloning-serving-split-title">Voice cloning과 TTS serving 분리 구조</title>
    <desc id="voice-cloning-serving-split-desc">Modal CPU에서 레퍼런스 음성을 custom voice JSON으로 한 번 변환하고, Oracle ARM64 서버가 그 JSON을 반복 사용해 여러 TTS 요청을 처리하는 구조를 보여준다.</desc>
    <defs>
      <marker id="vcss-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#595959"/></marker>
      <marker id="vcss-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#BD746D"/></marker>
      <marker id="vcss-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563EB"/></marker>
    </defs>

    <rect width="1280" height="720" fill="#FBFAF7"/>
    <text x="48" y="64" fill="#111111" font-size="28" font-weight="800" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">목소리는 한 번 만들고, TTS 서버는 계속 재사용한다</text>
    <text x="48" y="96" fill="#595959" font-size="12" font-weight="500" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif">CPU 작업의 생명주기를 분리하면 voice 추가와 실시간 serving이 서로 영향을 덜 받는다.</text>
    <rect x="1184" y="40" width="48" height="32" rx="8" fill="#FBFAF7" stroke="#111111" stroke-width="1.2"/>
    <text x="1208" y="61" fill="#111111" font-size="12" font-weight="700" text-anchor="middle" font-family="'SF Mono','Menlo',monospace">02</text>

