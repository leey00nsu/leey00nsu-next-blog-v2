    <text x="72" y="168" fill="#595959" font-size="12" font-weight="700" letter-spacing="1.4" font-family="'SF Mono','Menlo',monospace">MODAL CPU · VOICE CLONING · 1회성</text>
    <text x="72" y="428" fill="#595959" font-size="12" font-weight="700" letter-spacing="1.4" font-family="'SF Mono','Menlo',monospace">ORACLE ARM64 · TTS SERVING · 반복</text>

